# Surcharge pour le serveur de production : images publiées par la CI au lieu du build local,
# URL publique au lieu de localhost. Utilisée par .github/actions/deploy :
#
#   IMAGE_PREFIX=ghcr.io/<owner>/<repo> IMAGE_TAG=<sha> \
#   docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.deploy.yml up -d --no-build
#
# Variables à définir dans .env.docker du serveur (/srv/projects/portail-atelier-mosip) :
#
#   STACK=prod                                   (nom du projet et des conteneurs : portail_prod_*)
#   PUBLIC_URL=https://portail-mosip.benga.online
#   HTTP_PORT=4210                               (cible du reverse proxy HTTPS)
#   DB_DATABASE=esignet_portail
#   DB_USERNAME=esignet_portail
#   + APP_KEY, DB_PASSWORD, PORTAIL_ADMIN_NIPS et la section eSignet : modèle complet
#     dans .env.docker.production.example, procédure dans docs/MISE_EN_PRODUCTION_ESIGNET.md
#
# Clés du client eSignet : fichiers .pem du serveur dans ESIGNET_KEYS_DIR (défaut ./secrets/esignet),
# montés en lecture seule ; jamais dans l'image ni dans le dépôt.
#
# Services mutualisés du serveur (valeurs par défaut = noms du poste de développement) :
#
#   MUTUALISE_NETWORK=mutualise_net              (réseau Docker externe, défaut bd_mutualisee_net)
#   DB_HOST=pg_mutualise                         (conteneur PostgreSQL sur ce réseau)
#   MAIL_HOST=mailpit_mutualise                  (conteneur SMTP sur ce réseau)
#
# Portail et API partagent la même origine (nginx du frontend relaie /api) : une seule URL publique.
# Nécessite Docker Compose ≥ 2.24 (balises !reset / !override).
name: portail_${STACK:?STACK manquant (dev|prod)}

x-deploy-env: &deploy-env
  # Production : pas de trace détaillée renvoyée au navigateur ; cookie du parcours eSignet « Secure »
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${PUBLIC_URL:?PUBLIC_URL manquant (.env.docker)}
  FRONTEND_URL: ${PUBLIC_URL}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
  ESIGNET_REDIRECT_URI: ${PUBLIC_URL}/auth/esignet/retour
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE manquant (.env.docker)}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME manquant (.env.docker)}
  DB_HOST: ${DB_HOST:-pg_mutualise}
  MAIL_HOST: ${MAIL_HOST:-mailpit_mutualise}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX manquant}/backend:${IMAGE_TAG:?IMAGE_TAG manquant}
    container_name: portail_${STACK}_backend
    environment: *deploy-env
    # L'API n'est jointe que par le nginx du frontend : pas de port publié sur l'hôte
    ports: !reset []
    volumes:
      # Clés du client eSignet (client-private.pem, userinfo-private.pem si JWE), lecture seule
      - ${ESIGNET_KEYS_DIR:-./secrets/esignet}:/var/www/html/storage/app/private/esignet:ro

  scheduler:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    container_name: portail_${STACK}_scheduler
    environment: *deploy-env

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    container_name: portail_${STACK}_frontend
    ports: !override
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT manquant (.env.docker)}:80"

networks:
  bd_mutualisee_net:
    external: true
    name: ${MUTUALISE_NETWORK:-bd_mutualisee_net}
