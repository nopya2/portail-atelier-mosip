# Portail des services — intégration et déploiement continus (production uniquement).
#
#   PR vers main, push sur dev → tests (backend + frontend)
#   push sur main              → tests → images Docker (GHCR) → déploiement PRODUCTION (après approbation)
#   « Run workflow » sur main  → idem (redéploiement manuel)
#
# Prérequis GitHub (Settings → Environments → « production ») : secrets SSH_HOST, SSH_USER,
# SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS ; variables DEPLOY_PATH (/srv/projects/portail-atelier-mosip)
# et APP_PUBLIC_URL ; reviewers obligatoires ; déploiement limité à la branche main.
# Les secrets applicatifs (APP_KEY, DB_PASSWORD, eSignet…) et l'URL publique
# (PUBLIC_URL=https://portail-mosip.benga.online) restent dans .env.docker sur le serveur.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Style (Pint)
        # Non bloquant tant que le code existant n'a pas été formaté (vendor/bin/pint)
        # continue-on-error: true
        run: vendor/bin/pint --test

      - name: Tests 
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  images:
    name: Images Docker
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-prod:
    name: Déploiement PRODUCTION
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          image-tag: ${{ github.sha }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
