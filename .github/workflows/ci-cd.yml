# Portail des services — intégration et déploiement continus.
#
#   PR vers dev/main      → tests (backend + frontend)
#   push sur dev          → tests → images Docker (GHCR) → déploiement DEV (automatique)
#   tag vX.Y.Z (sur main) → tests → images Docker (GHCR) → déploiement PRODUCTION (après approbation)
#
# Prérequis GitHub (Settings → Environments) : environnements « dev » et « production »,
# chacun avec ses propres secrets SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS
# et ses variables DEPLOY_PATH et APP_PUBLIC_URL. « production » : reviewers obligatoires + tags v* uniquement.
# Les secrets applicatifs (APP_KEY, DB_PASSWORD, eSignet…) et l'URL publique (PUBLIC_URL) restent
# dans .env.docker sur chaque serveur :
#   dev        → https://dev-portail-mosip.benga.online
#   production → https://portail-mosip.benga.online
name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Style (Pint)
        # Non bloquant tant que le code existant n'a pas été formaté (vendor/bin/pint)
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  images:
    name: Images Docker
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-dev:
    name: Déploiement DEV
    needs: images
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.APP_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          image-tag: ${{ github.sha }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    name: Déploiement PRODUCTION
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          image-prefix: ${{ env.IMAGE_PREFIX }}
          image-tag: ${{ github.sha }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
